name: Refresh Station Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        # Same dependencies CI uses: the test suite imports pandas and
        # FastAPI, so installing only requests/openlocationcode made
        # the "Run ingestion tests" step fail on every scheduled run
        # (last three runs failed there, and no snapshot was ever
        # committed). Dash is still not installed: no test imports it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests openlocationcode pandas fastapi httpx a2wsgi

      - name: Refresh station data
        run: python -m ingestion.sync_stations

      - name: Run ingestion tests
        run: python -m unittest discover -s tests

      # Publication gate: a blocked snapshot never reaches the repo.
      # The previous snapshot stays in production and the public stale
      # warning appears on its own. The previous file comes from git,
      # not from the working tree, which already holds the new data.
      - name: Check publication gate
        run: |
          git show HEAD:data/stations_clean.json > /tmp/previous_clean.json || echo '{}' > /tmp/previous_clean.json
          python -m ingestion.publish_gate --new data/stations_clean.json --previous /tmp/previous_clean.json

      - name: Append dataset version
        run: python -m ingestion.append_version

      - name: Commit refreshed station data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh station data"
          file_pattern: data/stations_clean.json data/stations_rejected.json data/dataset_versions.json
